[project]
name = "rlvr-world-mlx"
version = "0.1.0"
description = "Toy-scale MLX post-training of a tokenized world model with GRPO on decoded prediction metrics"
requires-python = ">=3.10"
dependencies = ["mlx>=0.22", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
